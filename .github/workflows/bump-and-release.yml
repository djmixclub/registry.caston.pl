# Bumps the version on main, rolls CHANGELOG.md, commits `chore(release): v<version>`, pushes
# the annotated tag `v<version>` and creates the GitHub Release. See docs/deployment.md
# ("Releasing").
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >
          How to change the version: prerelease (next -beta.N),
          prepatch/preminor/premajor (start a prerelease of the next
          patch/minor/major), patch/minor/major, release (drop the prerelease
          suffix), none (release the current version as it is) or custom
        type: choice
        options:
          [prerelease, prepatch, preminor, premajor, patch, minor, major, release, none, custom]
        default: prerelease
      version:
        description: The version to release (only with bump custom)
        type: string
        default: ""

permissions:
  # Push the release commit and the tag, create the release.
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump and release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse branches other than main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases are cut from main only, to keep them linear; this run was started from $REF. Run the workflow from main."
          exit 1

      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Compute the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          args=("$BUMP")
          if [ -n "$VERSION" ]; then args+=("$VERSION"); fi
          current=$(node scripts/bump-version.mjs --current)
          next=$(node scripts/bump-version.mjs "${args[@]}")
          tag="v$next"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::The tag $tag already exists."
            exit 1
          fi
          case "$next" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "$current -> $next ($BUMP)"
          {
            echo "current=$current"
            echo "version=$next"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Apply the version and roll the changelog
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          args=("$BUMP")
          if [ -n "$VERSION" ]; then args+=("$VERSION"); fi
          node scripts/bump-version.mjs "${args[@]}" --dry-run
          node scripts/bump-version.mjs "${args[@]}" --apply --notes-file "$RUNNER_TEMP/notes.md"
          npx prettier --write CHANGELOG.md
          git diff --stat

      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: node --test 'scripts/*.test.mjs'

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing changed; tagging main as it is."
          else
            git commit --message "chore(release): $TAG"
          fi
          { echo "$TAG"; echo; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/tag-message.md"
          # verbatim: keep the "### Added" lines of the changelog in the tag message.
          git tag --annotate --cleanup=verbatim --file "$RUNNER_TEMP/tag-message.md" "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Create the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          # A prerelease is never the "latest" release, which the panel's update check reads.
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          echo "url=$(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always() && steps.version.outputs.version != ''
        env:
          BUMP: ${{ inputs.bump }}
          CURRENT: ${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "## $TAG"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$CURRENT\` → \`$VERSION\` (\`$BUMP\`) |"
            echo "| Prerelease | $PRERELEASE |"
            echo "| Tag | [$TAG]($repo/tree/$TAG) |"
            echo "| GitHub Release | ${RELEASE_URL:-not created} |"
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              echo
              echo "### Release notes"
              echo
              cat "$RUNNER_TEMP/notes.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
