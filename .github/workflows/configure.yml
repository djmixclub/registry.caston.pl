# Writes the bindings of this installation (the R2 bucket and its jurisdiction, the KV namespace,
# the Worker's name and a custom domain) into wrangler.jsonc, commits the change to the default branch and
# deploys it, so the bindings live in the repository and survive updates (the "Update from
# upstream" workflow keeps them). Settings left empty stay as they are. The variables and
# secrets of the Worker are not touched: they live in the Cloudflare dashboard. In the upstream
# repository it skips itself. See docs/deployment.md ("Configure bindings").
name: Configure bindings

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Name of the Worker (name in wrangler.jsonc)
        type: string
        default: ""
      r2_bucket:
        description: Name of the R2 bucket that holds the packages (binding R2_BUCKET)
        type: string
        default: ""
      r2_jurisdiction:
        description: >
          Jurisdiction of that bucket: eu or fedramp if you created it in one, none for the
          default one, unchanged to leave wrangler.jsonc as it is
        type: choice
        options: [unchanged, eu, fedramp, none]
        default: unchanged
      kv_namespace_id:
        description: ID of the KV namespace of the credentials (binding AUTH); empty lets Wrangler find or create it
        type: string
        default: ""
      route:
        description: Custom domain of the registry, such as packages.example.com (no path)
        type: string
        default: ""
      dry_run:
        description: Only show what would change; nothing is committed or pushed
        type: boolean
        default: false

permissions:
  # Push the change to the default branch; start the deploy workflow afterwards.
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  configure:
    name: Configure bindings
    if: github.repository != 'kduma-OSS/serverless-registry-worker'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
      WORKER_NAME: ${{ inputs.worker_name }}
      R2_BUCKET_INPUT: ${{ inputs.r2_bucket }}
      R2_JURISDICTION: ${{ inputs.r2_jurisdiction }}
      KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
      ROUTE: ${{ inputs.route }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Refuse branches other than the default one
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Run this workflow on the default branch ($BRANCH); it was started on $GITHUB_REF_NAME."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Write the bindings
        id: configure
        run: |
          args=()
          if [ -n "$WORKER_NAME" ]; then args+=(--worker-name "$WORKER_NAME"); fi
          if [ -n "$R2_BUCKET_INPUT" ]; then args+=(--r2-bucket "$R2_BUCKET_INPUT"); fi
          if [ -n "$R2_JURISDICTION" ] && [ "$R2_JURISDICTION" != unchanged ]; then args+=(--r2-jurisdiction "$R2_JURISDICTION"); fi
          if [ -n "$KV_NAMESPACE_ID" ]; then args+=(--kv-namespace-id "$KV_NAMESPACE_ID"); fi
          if [ -n "$ROUTE" ]; then args+=(--route "$ROUTE"); fi
          node scripts/configure-wrangler.mjs "${args[@]}" > "$RUNNER_TEMP/configure.json"
          cat "$RUNNER_TEMP/configure.json"
          echo "changed=$(jq -r .changed "$RUNNER_TEMP/configure.json")" >> "$GITHUB_OUTPUT"
          git diff -- wrangler.jsonc

      - name: Install
        if: steps.configure.outputs.changed == 'true'
        run: npm ci

      - name: Check the result
        if: steps.configure.outputs.changed == 'true'
        # The configuration parses and the bindings resolve; nothing is deployed.
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"

      - name: Commit and push
        if: steps.configure.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          git commit --message "chore: configure bindings"
          git push origin "HEAD:refs/heads/$BRANCH"

      # A push made with GITHUB_TOKEN does not start other workflows; Workers Builds deploys
      # from the push itself.
      - name: Start the deploy workflow
        if: steps.configure.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$BRANCH" || echo "::notice::The deploy workflow was not started; it deploys on the next push to $BRANCH."

      - name: Summary
        if: always() && steps.configure.outputs.changed != ''
        env:
          CHANGED: ${{ steps.configure.outputs.changed }}
        run: |
          {
            echo "## Configure bindings"
            echo
            if [ "$CHANGED" != true ]; then
              echo "- Nothing to change: wrangler.jsonc already has these settings."
            else
              if [ "$DRY_RUN" = true ]; then
                echo "- Dry run: nothing was committed or pushed. wrangler.jsonc would get:"
              else
                echo "- Committed and pushed to \`$BRANCH\`. wrangler.jsonc now has:"
              fi
              jq -r '.changes[] | "  - " + .' "$RUNNER_TEMP/configure.json"
            fi
            if [ -n "$R2_BUCKET_INPUT" ]; then
              echo "- The variable \`R2_BUCKET_NAME\` in the Cloudflare dashboard must be \`$R2_BUCKET_INPUT\` too: presigned URLs address the bucket by that name."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
