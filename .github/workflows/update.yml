# Brings the code of the upstream repository (kduma-OSS/serverless-registry-worker) into this
# repository: pick stable, prerelease, a tag of your own (custom) or develop (upstream's main).
# It never goes back to an older version than this repository has, lays this installation's
# bindings over wrangler.jsonc when the two files conflict and pushes the result to the default
# branch, which deploys it. Files of .github/workflows are only updated when the secret
# UPDATE_TOKEN (a token that may write workflows) is set. In the upstream repository it skips
# itself. See docs/deployment.md ("Updating with a workflow").
name: Update from upstream

on:
  workflow_dispatch:
    inputs:
      channel:
        description: >
          What to update to: stable (the newest release), prerelease (the newest release or
          prerelease), custom (the tag below) or develop (upstream's main branch)
        type: choice
        options: [stable, prerelease, custom, develop]
        default: stable
      tag:
        description: The release tag to update to, such as v0.2.0 (only with channel custom)
        type: string
        default: ""
      dry_run:
        description: Only show what would change; nothing is committed or pushed
        type: boolean
        default: false

permissions:
  # Push the merge to the default branch; start the deploy workflow afterwards.
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    name: Update from upstream
    if: github.repository != 'kduma-OSS/serverless-registry-worker'
    runs-on: ubuntu-latest
    env:
      UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
      BRANCH: ${{ github.event.repository.default_branch }}
      CHANNEL: ${{ inputs.channel }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Refuse branches other than the default one
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Run this workflow on the default branch ($BRANCH); it was started on $GITHUB_REF_NAME."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # With UPDATE_TOKEN the push may change .github/workflows.
          token: ${{ secrets.UPDATE_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Choose the release
        id: plan
        run: |
          node scripts/sync-upstream.mjs plan --channel "$CHANNEL" --tag "$TAG" > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          {
            echo "label=$(jq -r .label "$RUNNER_TEMP/plan.json")"
            echo "version=$(jq -r .version "$RUNNER_TEMP/plan.json")"
            echo "current=$(jq -r .current "$RUNNER_TEMP/plan.json")"
            echo "relation=$(jq -r .relation "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        id: merge
        env:
          LABEL: ${{ steps.plan.outputs.label }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          if [ -n "$UPDATE_TOKEN" ]; then args+=(--allow-workflows); fi
          if [ "$DRY_RUN" != true ]; then
            if [ "$CHANNEL" = develop ]; then
              args+=(--message "chore: update from upstream develop (v$VERSION)")
            else
              args+=(--message "chore: update from upstream $LABEL")
            fi
          fi
          node scripts/sync-upstream.mjs merge "${args[@]}" > "$RUNNER_TEMP/merge.json"
          cat "$RUNNER_TEMP/merge.json"
          echo "status=$(jq -r .status "$RUNNER_TEMP/merge.json")" >> "$GITHUB_OUTPUT"
          for file in $(jq -r '.skippedWorkflows[]' "$RUNNER_TEMP/merge.json"); do
            echo "::warning file=$file::Not updated: set the secret UPDATE_TOKEN to let this workflow update files of .github/workflows."
          done

      - name: Install
        if: steps.merge.outputs.status == 'merged'
        run: npm ci

      - name: Check the result
        if: steps.merge.outputs.status == 'merged'
        run: |
          npm run check
          # The configuration parses and the bindings resolve; nothing is deployed.
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"

      - name: Push
        if: steps.merge.outputs.status == 'merged' && inputs.dry_run != true
        run: git push origin "HEAD:refs/heads/$BRANCH"

      # A push made with GITHUB_TOKEN does not start other workflows; one made with
      # UPDATE_TOKEN does. Workers Builds deploys either way, from the push itself.
      - name: Start the deploy workflow
        if: steps.merge.outputs.status == 'merged' && inputs.dry_run != true && env.UPDATE_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$BRANCH" || echo "::notice::The deploy workflow was not started; it deploys on the next push to $BRANCH."

      - name: Summary
        if: always() && steps.plan.outputs.version != ''
        env:
          LABEL: ${{ steps.plan.outputs.label }}
          VERSION: ${{ steps.plan.outputs.version }}
          CURRENT: ${{ steps.plan.outputs.current }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          {
            echo "## Update from upstream"
            echo
            echo "- Channel: \`$CHANNEL\` ($LABEL)"
            echo "- Version: $CURRENT → $VERSION"
            case "$STATUS" in
              up-to-date) echo "- Nothing to merge: this repository already has $LABEL." ;;
              merged)
                if [ "$DRY_RUN" = true ]; then
                  echo "- Dry run: nothing was committed or pushed. The merge would change:"
                  echo
                  echo '```'
                  git diff --cached --stat HEAD
                  echo '```'
                else
                  echo "- Merged and pushed to \`$BRANCH\`."
                fi
                carried=$(jq -r '.carried | join(", ")' "$RUNNER_TEMP/merge.json")
                if [ -n "$carried" ]; then echo "- Kept from this repository's wrangler.jsonc: $carried."; fi
                skipped=$(jq -r '.skippedWorkflows | join(", ")' "$RUNNER_TEMP/merge.json")
                if [ -n "$skipped" ]; then echo "- Not updated (no UPDATE_TOKEN): $skipped."; fi
                echo "- Check the \`R2_BUCKET\` binding in the Cloudflare dashboard after the deploy (Settings → Bindings)."
                ;;
              *) echo "- The update did not complete; see the log above." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
